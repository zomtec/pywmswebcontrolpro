[project]
name = "pywmswebcontrolpro"
dynamic = ["version"]
description = "Python library for the Warema WMS WebControl pro API"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Marc Hoersken", email = "info@marc-hoersken.de" }
]
maintainers = [
    { name = "zomtec" }
]
readme = "README.md"
repository = "https://github.com/zomtec/pywmswebcontrolpro"
keywords = ["warema", "wms", "webcontrol"]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["pywmswebcontrolpro"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--tags"]
local_scheme = "no-local-version"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
