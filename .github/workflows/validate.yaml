---
name: Validate
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_lint.txt
      - run: python -m pip install -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -v
...
